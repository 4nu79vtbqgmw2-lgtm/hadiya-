    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #song {
            position: fixed;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

<style id="lyrics-position-fix">
#lyrics-word {
    position: fixed !important;
    left: 50% !important;
    top: clamp(42px, 10vh, 105px) !important;
    bottom: auto !important;
    transform: translate(-50%, 12px) scale(.96) !important;
    z-index: 99999 !important;
    width: min(92vw, 1080px) !important;
    max-height: 22vh !important;
    overflow: hidden !important;
    padding: 0 12px !important;
    text-align: center !important;
    direction: rtl !important;
    color: #eafaff !important;
    font-family: Arial, "Segoe UI", sans-serif !important;
    font-size: clamp(20px, 3.2vw, 46px) !important;
    font-weight: 800 !important;
    line-height: 1.4 !important;
    pointer-events: none !important;
    opacity: 0 !important;
    transition: opacity .35s ease, transform .35s ease !important;
    text-shadow:
        0 0 6px #00b7ff,
        0 0 16px #008cff,
        0 0 30px #006eff,
        0 0 52px rgba(0,153,255,.9) !important;
    filter: drop-shadow(0 0 10px rgba(0,153,255,.8));
}
#lyrics-word.show {
    opacity: 1 !important;
    transform: translate(-50%, 0) scale(1) !important;
}

@media (max-width: 700px) {
    #lyrics-word {
        top: 9vh !important;
        width: 94vw !important;
        max-height: 25vh !important;
        padding: 0 8px !important;
        font-size: clamp(18px, 5.2vw, 32px) !important;
        line-height: 1.38 !important;
    }
}

@media (max-width: 420px) {
    #lyrics-word {
        top: 8vh !important;
        width: 96vw !important;
        font-size: clamp(17px, 5.6vw, 27px) !important;
    }
}
</style>

<style>
#lyrics-word {
    position: fixed;
    left: 50%;
    top: 12%;
    bottom: auto;
    transform: translate(-50%, 10px) scale(.97);
    z-index: 9999;
    width: min(94vw, 1050px);
    padding: 0 16px;
    text-align: center;
    direction: rtl;
    color: #dff8ff;
    font-family: Arial, "Segoe UI", sans-serif;
    font-size: clamp(21px, 3.8vw, 50px);
    font-weight: 800;
    line-height: 1.45;
    opacity: 0;
    pointer-events: none;
    transition: opacity .4s ease, transform .4s ease;
    text-shadow:
        0 0 6px #00b7ff,
        0 0 16px #008cff,
        0 0 30px #006eff,
        0 0 52px rgba(0,153,255,.9);
    filter: drop-shadow(0 0 10px rgba(0,153,255,.85));
}
#lyrics-word.show {
    opacity: 1;
    transform: translate(-50%, 0) scale(1);
}
</style>

<div id="lyrics-word"></div>

<script>
(() => {
    const song = document.getElementById('song');
    const lyricsEl = document.getElementById('lyrics-word');

    const phrases = [
        'حه ش ته كم باشترين كه سا من 💙🥹',
        'بيبيكا مني ئه لونا 💙🥹',
        'باشترين كه سا من هه مي كه سي من 💙🥹',
        'بي ته ناژيم 🥲💙',
        'پيتفي ب كه سي نابم جنكي ته جهي هه ميا كرتيه 😍💙',
        'ئه لونا كا منه 🥹💙',
        'حه ش ته كم بيبيكا من يا شرين جاف كه سكا من 🥹💚',
        'جاف شرينا من 🥹💚'
    ];

    const playLimit = 25;
    const fadeDuration = 8;
    const phraseInterval = (playLimit * 1000) / phrases.length;
    let timer = null;
    let index = 0;

    function showPhrase(text) {
        lyricsEl.classList.remove('show');
        void lyricsEl.offsetWidth;
        lyricsEl.textContent = text;
        lyricsEl.classList.add('show');
    }

    function startLyrics() {
        clearInterval(timer);
        index = 0;
        showPhrase(phrases[0]);
        timer = setInterval(() => {
            index++;
            if (index >= phrases.length) {
                clearInterval(timer);
                return;
            }
            showPhrase(phrases[index]);
        }, phraseInterval);
    }

    function stopLyrics() {
        clearInterval(timer);
        timer = null;
        lyricsEl.classList.remove('show');
    }

    // الكلمات تتزامن مع تشغيل الأغنية
    song.addEventListener('play', startLyrics);
    song.addEventListener('pause', stopLyrics);
    song.addEventListener('ended', stopLyrics);

    // 25 ثانية + Fade Out في آخر 8 ثوانٍ
    song.addEventListener('timeupdate', () => {
        if (!Number.isFinite(song.currentTime)) return;
        if (song.currentTime >= playLimit) {
            song.pause();
            song.currentTime = playLimit;
            song.volume = 0;
            stopLyrics();
            return;
        }
        const remaining = playLimit - song.currentTime;
        song.volume = remaining <= fadeDuration
            ? Math.max(0, remaining / fadeDuration)
            : 1;
    });

    // تشغيل تلقائي عند دخول الموقع؛ fallback لأول نقرة إذا منع المتصفح autoplay
    async function tryPlay() {
        try {
            song.volume = 1;
            await song.play();
        } catch (e) {
            const unlock = async () => {
                try {
                    song.volume = 1;
                    await song.play();
                } finally {
                    window.removeEventListener('pointerdown', unlock);
                    window.removeEventListener('keydown', unlock);
                }
            };
            window.addEventListener('pointerdown', unlock, { once: true });
            window.addEventListener('keydown', unlock, { once: true });
        }
    }

    window.addEventListener('load', tryPlay);
})();
</script>
